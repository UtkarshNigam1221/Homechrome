<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border radius -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Handloom Weave Motif -->
  <g transform="translate(96, 96)">
    <!-- Vertical Warp Threads -->
    <line x1="64" y1="40" x2="64" y2="280" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <line x1="128" y1="40" x2="128" y2="280" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <line x1="192" y1="40" x2="192" y2="280" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <line x1="256" y1="40" x2="256" y2="280" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    
    <!-- Horizontal Weft Shuttles -->
    <line x1="32" y1="96" x2="288" y2="96" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.9" />
    <line x1="32" y1="160" x2="288" y2="160" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    <line x1="32" y1="224" x2="288" y2="224" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.9" />
    
    <!-- Diamond Weave Center Accent -->
    <polygon points="160,120 200,160 160,200 120,160" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" />
    
    <!-- Monogram 'H' -->
    <path d="M142,145 L142,175 M178,145 L178,175 M142,160 L178,160" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>

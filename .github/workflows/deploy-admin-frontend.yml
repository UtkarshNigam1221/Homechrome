name: Deploy Admin Frontend

on:
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

env:
  CERT_ARN: arn:aws:acm:us-east-1:163053486005:certificate/4e15c02f-e7ef-48df-8eff-5097eefed2e8

jobs:
  check:
    name: Typecheck, Lint & Format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handloom-admin-frontend
    steps:
      - uses: actions/checkout@v6

      - name: Generate lock file
        run: npm install --package-lock-only --ignore-scripts
        working-directory: handloom-admin-frontend

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: handloom-admin-frontend/package-lock.json

      - run: npm ci
      - run: npm run check
      - name: Build check
        run: npm run build:dev

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handloom-admin-frontend
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate lock file
        run: npm install --package-lock-only --ignore-scripts
        working-directory: handloom-admin-frontend

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: handloom-admin-frontend/package-lock.json

      - name: Install CDK
        run: npm install -g aws-cdk

      - run: npm ci

      - name: Build
        run: npm run build:${{ inputs.environment }}

      - name: CDK Deploy
        run: |
          cd infra && cdk deploy --all --require-approval never \
            -c environment=${{ inputs.environment }} \
            -c certArn=${{ env.CERT_ARN }}

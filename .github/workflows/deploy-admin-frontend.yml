name: Deploy Admin Frontend

on:
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  check:
    name: Typecheck, Lint & Format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handloom-admin-frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: handloom-admin-frontend/package-lock.json

      # Workaround for npm bug 4828: macOS-generated lockfile does not record
      # Linux platform-specific optional deps (Rolldown native binding used by
      # Vite 8). Remove the lockfile + node_modules so npm regenerates the
      # dep tree against the Linux runner. Loses lockfile pinning in CI; the
      # tradeoff is acceptable until npm fixes 4828 upstream.
      - run: rm -rf node_modules package-lock.json
      - run: npm install
      - run: npm run check
      - name: Build check
        run: npm run build:dev

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handloom-admin-frontend
    steps:
      - name: Guard prod deploy from non-main branches
        if: inputs.environment == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Prod deploy must be triggered from main. Current ref: ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: handloom-admin-frontend/package-lock.json

      - name: Install CDK
        run: npm install -g aws-cdk

      # Workaround for npm bug 4828: see check job above.
      - run: rm -rf node_modules package-lock.json
      - run: npm install

      - name: Build
        run: npm run build:${{ inputs.environment }}

      - name: CDK Deploy
        run: |
          cd infra && cdk deploy --all --require-approval never \
            -c environment=${{ inputs.environment }}

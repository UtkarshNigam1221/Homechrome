name: Deploy Admin Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      branch:
        description: 'Branch/ref to build & deploy (prod requires main)'
        required: false
        type: string
        default: main

  # Allows the deploy-all orchestrator to invoke this workflow.
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: string
      branch:
        description: 'Branch/ref to build & deploy'
        required: false
        type: string
        default: main

permissions:
  id-token: write
  contents: read

jobs:
  # Single job: build + deploy on one runner. dist/ stays on-disk instead of
  # crossing a job boundary via an Actions artifact (was burning storage quota).
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handloom-admin-frontend
    steps:
      - name: Guard prod deploy from non-main branches
        if: inputs.environment == 'prod' && inputs.branch != 'main'
        run: |
          echo "::error::Prod deploy must target main. Chosen branch: ${{ inputs.branch }}"
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: handloom-admin-frontend/package-lock.json

      # Workaround for npm bug 4828: see check job above.
      - run: rm -rf node_modules package-lock.json
      - run: npm install

      - name: Build
        run: npm run build:${{ inputs.environment }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # CDK app is `go run ./cmd/` — Go is required to synth/deploy.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: handloom-admin-frontend/infra/go.sum

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: CDK Deploy
        run: |
          cd infra && cdk deploy --all --require-approval never \
            -c environment=${{ inputs.environment }}

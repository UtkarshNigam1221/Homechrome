name: CI

# PR gate only. Build + deploy live in the deploy-* workflows (workflow_dispatch
# / workflow_call), so they no longer show up as skipped jobs on pull requests.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-frontend:
    name: Admin Frontend — Typecheck, Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handloom-admin-frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: handloom-admin-frontend/package-lock.json

      # Workaround for npm bug 4828: macOS-generated lockfile does not record
      # Linux platform-specific optional deps (Rolldown native binding used by
      # Vite 8). Remove the lockfile + node_modules so npm regenerates the
      # dep tree against the Linux runner. Loses lockfile pinning in CI; the
      # tradeoff is acceptable until npm fixes 4828 upstream.
      - run: rm -rf node_modules package-lock.json
      - run: npm install
      - run: npm run check
      - name: Build check
        run: npm run build:dev

  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handloom-admin
    # Repository tests connect to a real PostgreSQL. Without one they call
    # t.Skipf and `go test` still reports ok, so the catalog + inventory SQL
    # would go completely unverified on a green gate.
    services:
      postgres:
        # Same image as docker-compose.yml: migration 005 needs the `vector`
        # extension, which stock postgres:16 does not ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: handloom
          POSTGRES_PASSWORD: handloom
          POSTGRES_DB: handloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handloom -d handloom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The dynamodb repository tests create and drop their own handloom-*-test
      # tables, so no migration or seed step is needed — only a reachable
      # endpoint. testClient defaults to :8000, which is this image's port.
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    env:
      POSTGRES_DSN: postgres://handloom:handloom@localhost:5432/handloom?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: handloom-admin/go.sum

      # The embedder package is CGO and links libtokenizers.a; `make test`
      # (go test ./...) builds its test binary, so the lib must be present.
      - name: Install libtokenizers (embedder CGO dep)
        run: make install-libtokenizers

      - name: Generate mocks
        run: |
          go install go.uber.org/mock/mockgen@latest
          make generate-mocks

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: handloom-admin

      # Same files the migrator Lambda embeds and docker-compose mounts into
      # docker-entrypoint-initdb.d, applied in filename order.
      - name: Apply migrations
        run: |
          for f in migrations/*.sql; do
            echo "applying $f"
            psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Test
        run: make test

      - name: Build check
        run: make build-lambdas-active

  store:
    name: Storefront — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homechrome-store
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homechrome-store/package-lock.json

      # Workaround for npm bug 4828: macOS-generated lockfile does not record
      # Linux platform-specific optional deps (Next SWC, lightningcss for
      # Tailwind 4). Remove the lockfile + node_modules so npm regenerates the
      # dep tree against the Linux runner. Loses lockfile pinning in CI.
      - run: rm -rf node_modules package-lock.json
      - run: npm install
      - run: npm run lint
      - name: Build check
        run: npm run build

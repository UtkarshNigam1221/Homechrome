name: Promote Catalog

# Promotes catalog data (categories, products, media) from dev to prod.
# Additive-only: upserts by id, never deletes prod-only data. See
# handloom-admin/scripts/promote-catalog/main.go for the full semantics.

on:
  workflow_dispatch:
    inputs:
      products:
        description: 'Products to promote: "active", "all", or comma-separated ids'
        required: true
        default: active
        type: string
      overwrite_inventory:
        description: 'Overwrite prod stock quantities with dev values'
        type: boolean
        default: false
      skip_s3:
        description: 'Skip S3 media sync'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# Never two prod-writing runs at once (deadlocks + interleaved S3 syncs).
concurrency:
  group: promote-catalog
  cancel-in-progress: false

jobs:
  promote:
    name: Promote dev → prod
    runs-on: ubuntu-latest
    # The branch guard below is only a courtesy message: workflow_dispatch runs
    # the workflow file FROM THE SELECTED REF, so a branch can simply remove it.
    # The enforceable control is this environment — configure it in repo
    # Settings → Environments → production with a deployment branch policy of
    # `main` and move BACKEND_ENV_PROD into its environment secrets. Runs
    # dispatched from any other branch then fail before secrets are exposed.
    environment: production
    steps:
      - name: Guard prod promotion from non-main branches
        env:
          # Via env, never inline templating — ref names can carry shell metachars.
          REF: ${{ github.ref_name }}
        run: |
          if [ "$REF" != "main" ]; then
            echo "::error::Catalog promotion must run from main. Selected ref: $REF"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: handloom-admin/go.sum

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Promote catalog
        working-directory: handloom-admin
        env:
          BACKEND_ENV_DEV: ${{ secrets.BACKEND_ENV_DEV }}
          BACKEND_ENV_PROD: ${{ secrets.BACKEND_ENV_PROD }}
          # Passed via env, not inline templating, so the value can't inject shell.
          PRODUCTS: ${{ inputs.products }}
        run: |
          # Extract POSTGRES_DSN with grep — never source the secret blob, a
          # value containing shell metacharacters must not corrupt or execute.
          dsn_from() {
            printf '%s\n' "$1" | grep -m1 '^POSTGRES_DSN=' | cut -d= -f2- \
              | sed -e "s/^['\"]//" -e "s/['\"]\$//"
          }
          DEV_DSN="$(dsn_from "$BACKEND_ENV_DEV")"
          PROD_DSN="$(dsn_from "$BACKEND_ENV_PROD")"
          export DEV_DSN PROD_DSN

          if [ -z "$DEV_DSN" ] || [ -z "$PROD_DSN" ]; then
            echo "::error::POSTGRES_DSN missing from BACKEND_ENV_DEV or BACKEND_ENV_PROD secret." >&2
            exit 1
          fi

          args=( --products "$PRODUCTS" --yes )
          if [ "${{ inputs.overwrite_inventory }}" = "true" ]; then
            args+=( --overwrite-inventory )
          fi
          if [ "${{ inputs.skip_s3 }}" = "true" ]; then
            args+=( --skip-s3 )
          fi

          go run ./scripts/promote-catalog "${args[@]}"

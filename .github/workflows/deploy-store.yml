name: Deploy Storefront

on:
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  check:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homechrome-store
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homechrome-store/package-lock.json

      # Workaround for npm bug 4828: lockfile generated on macOS does not
      # always include platform-specific optional deps (Next.js SWC,
      # lightningcss for Tailwind CSS 4). Reinstall optional deps on Linux.
      - run: npm ci
      - run: npm install --no-save --include=optional --force
      - run: npm run lint
      - name: Build check
        run: npm run build

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homechrome-store
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homechrome-store/package-lock.json

      - name: Install CDK
        run: npm install -g aws-cdk

      # Workaround for npm bug 4828: see check job above.
      - run: npm ci
      - run: npm install --no-save --include=optional --force

      - name: Set environment URLs
        id: urls
        run: |
          DOMAIN="homechrome.in"
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "api_url=https://api.${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://dev-api.${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://dev-store.${DOMAIN}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with OpenNext
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.urls.outputs.api_url }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.urls.outputs.site_url }}
        run: npx @opennextjs/aws build

      - name: CDK Deploy
        run: |
          cd infra && cdk deploy --all --require-approval never \
            -c environment=${{ inputs.environment }}

      - name: Invalidate CloudFront Cache
        run: |
          STACK_NAME="HomechromeStoreStack-${{ inputs.environment }}"
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*'

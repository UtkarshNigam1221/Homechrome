name: Deploy Storefront

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, prod]
        default: dev

  # Allows the deploy-all orchestrator to invoke this workflow.
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  # Single job: build + deploy on one runner. Keeps the OpenNext output on-disk
  # instead of shipping 2600+ files (or a tarball) through an Actions artifact,
  # which was exhausting the artifact-storage quota.
  deploy:
    name: Build & Deploy
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    # OpenNext hardcodes sharp 0.32.6 for the image Lambda and only honours
    # SHARP_VERSION; root package.json overrides do not reach that bundle.
    env:
      SHARP_VERSION: 0.35.0
    defaults:
      run:
        working-directory: homechrome-store
    steps:
      - name: Guard prod deploy from non-main branches
        if: inputs.environment == 'prod' && github.ref_name != 'main'
        run: |
          echo "::error::Prod deploy must target main. Selected ref: ${{ github.ref_name }}"
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homechrome-store/package-lock.json

      # Workaround for npm bug 4828: see check job above.
      - run: rm -rf node_modules package-lock.json
      - run: npm install

      - name: Set environment URLs
        id: urls
        run: |
          DOMAIN="homechrome.in"
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "api_url=https://api.${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://www.${DOMAIN}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://dev-api.${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://dev-store.${DOMAIN}" >> "$GITHUB_OUTPUT"
          fi

      # NEXT_PUBLIC_* are baked in at build time, so the build is environment-specific.
      - name: Build with OpenNext
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.urls.outputs.api_url }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.urls.outputs.site_url }}
        run: npx @opennextjs/aws build

      # The server Lambda has the OTel collector layer + AWS_LAMBDA_EXEC_WRAPPER
      # pointing at /var/task/otel.yaml (see infra/stacks/storefront.go). The npm
      # `open-next:build` script copies it in, but this workflow calls the bare
      # `npx ... build`, so replicate the copy here — otherwise the collector
      # extension boots against a missing config, crashes on init, and the
      # Function URL serves errors for every request.
      - name: Bundle OTel collector config into server function
        run: cp ../handloom-admin/infra/configs/otel-collector.yaml .open-next/server-functions/default/otel.yaml

      # Fail loudly at the build (not the opaque deploy step) and surface the
      # output tree so a missing .open-next is diagnosable from the log.
      - name: Verify OpenNext output
        run: |
          echo "--- .open-next ---"; ls -la .open-next 2>&1 || echo "MISSING .open-next"
          test -d .open-next/server-functions/default || {
            echo "::error::OpenNext build produced no .open-next/server-functions/default"; exit 1; }
          test -f .open-next/server-functions/default/otel.yaml || {
            echo "::error::otel.yaml not bundled into the server function"; exit 1; }
          bundled=$(node -p "require('./.open-next/image-optimization-function/node_modules/sharp/package.json').version")
          echo "image function sharp: $bundled"
          test "$bundled" = "$SHARP_VERSION" || {
            echo "::error::image function bundled sharp $bundled, expected $SHARP_VERSION (GHSA-f88m-g3jw-g9cj)"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # CDK app is `go run ./cmd/` — Go is required to synth/deploy.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: homechrome-store/infra/go.sum

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: CDK Deploy
        run: |
          cd infra && cdk deploy --all --require-approval never \
            -c environment=${{ inputs.environment }}

      - name: Wipe Next.js ISR cache from S3
        run: |
          STACK_NAME="HomechromeStoreStack-${{ inputs.environment }}"
          CACHE_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          if [ -n "$CACHE_BUCKET" ] && [ "$CACHE_BUCKET" != "None" ]; then
            aws s3 rm "s3://$CACHE_BUCKET/_cache/" --recursive --only-show-errors
            echo "Wiped _cache/ from $CACHE_BUCKET"
          else
            echo "BucketName output not found on $STACK_NAME — skipping ISR cache wipe"
          fi

      - name: Invalidate CloudFront Cache
        run: |
          STACK_NAME="HomechromeStoreStack-${{ inputs.environment }}"
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*'

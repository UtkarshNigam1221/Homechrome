name: Deploy Storefront

on:
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

env:
  CERT_ARN: arn:aws:acm:us-east-1:163053486005:certificate/4e15c02f-e7ef-48df-8eff-5097eefed2e8

jobs:
  check:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homechrome-store
    steps:
      - uses: actions/checkout@v6

      - name: Generate lock file
        run: npm install --package-lock-only
        working-directory: homechrome-store

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homechrome-store/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Build check
        run: npm run build

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homechrome-store
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate lock file
        run: npm install --package-lock-only
        working-directory: homechrome-store

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homechrome-store/package-lock.json

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Set environment URLs
        id: urls
        run: |
          DOMAIN="${{ vars.BASE_DOMAIN }}"
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "api_url=https://api.${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "stack_name=HomechromeStoreStack-prod" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://dev-api.${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://dev-store.${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "stack_name=HomechromeStoreStack-dev" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build with OpenNext
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.urls.outputs.api_url }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.urls.outputs.site_url }}
        run: npx @opennextjs/aws build

      - name: CDK Deploy
        run: |
          cd infra && cdk deploy --all --require-approval never \
            -c environment=${{ inputs.environment }} \
            -c certArn=${{ env.CERT_ARN }}

      - name: Invalidate CloudFront Cache
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ steps.urls.outputs.stack_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*'

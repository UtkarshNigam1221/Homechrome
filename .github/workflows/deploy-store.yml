name: Deploy Storefront

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      branch:
        description: 'Branch/ref to build & deploy (prod requires main)'
        required: false
        type: string
        default: main

  # Allows the deploy-all orchestrator to invoke this workflow.
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: string
      branch:
        description: 'Branch/ref to build & deploy'
        required: false
        type: string
        default: main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homechrome-store
    steps:
      - name: Guard prod deploy from non-main branches
        if: inputs.environment == 'prod' && inputs.branch != 'main'
        run: |
          echo "::error::Prod deploy must target main. Chosen branch: ${{ inputs.branch }}"
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homechrome-store/package-lock.json

      # Workaround for npm bug 4828: see check job above.
      - run: rm -rf node_modules package-lock.json
      - run: npm install

      - name: Set environment URLs
        id: urls
        run: |
          DOMAIN="homechrome.in"
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "api_url=https://api.${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://dev-api.${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://dev-store.${DOMAIN}" >> "$GITHUB_OUTPUT"
          fi

      # NEXT_PUBLIC_* are baked in at build time, so the build is environment-specific.
      - name: Build with OpenNext
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.urls.outputs.api_url }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.urls.outputs.site_url }}
        run: npx @opennextjs/aws build

      - uses: actions/upload-artifact@v4
        with:
          name: store-open-next-${{ inputs.environment }}
          path: homechrome-store/.open-next
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homechrome-store
    steps:
      - name: Guard prod deploy from non-main branches
        if: inputs.environment == 'prod' && inputs.branch != 'main'
        run: |
          echo "::error::Prod deploy must target main. Chosen branch: ${{ inputs.branch }}"
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/download-artifact@v4
        with:
          name: store-open-next-${{ inputs.environment }}
          path: homechrome-store/.open-next

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # CDK app is `go run ./cmd/` — Go is required to synth/deploy.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: homechrome-store/infra/go.sum

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: CDK Deploy
        run: |
          cd infra && cdk deploy --all --require-approval never \
            -c environment=${{ inputs.environment }}

      - name: Wipe Next.js ISR cache from S3
        run: |
          STACK_NAME="HomechromeStoreStack-${{ inputs.environment }}"
          CACHE_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          if [ -n "$CACHE_BUCKET" ] && [ "$CACHE_BUCKET" != "None" ]; then
            aws s3 rm "s3://$CACHE_BUCKET/_cache/" --recursive --only-show-errors
            echo "Wiped _cache/ from $CACHE_BUCKET"
          else
            echo "BucketName output not found on $STACK_NAME — skipping ISR cache wipe"
          fi

      - name: Invalidate CloudFront Cache
        run: |
          STACK_NAME="HomechromeStoreStack-${{ inputs.environment }}"
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*'

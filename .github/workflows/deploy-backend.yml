name: Deploy Backend

on:
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  check:
    name: Lint & Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handloom-admin
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: handloom-admin/go.sum

      - name: Generate mocks
        run: |
          go install go.uber.org/mock/mockgen@latest
          make generate-mocks

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: handloom-admin

      - name: Test
        run: make test

      - name: Build check
        run: make build-lambdas-active

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handloom-admin
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: handloom-admin/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Write .env file
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "${{ secrets.BACKEND_ENV_PROD }}" > .env.deploy
          else
            echo "${{ secrets.BACKEND_ENV_DEV }}" > .env.deploy
          fi

      - name: Build Lambdas
        run: make build-lambdas-active

      - name: CDK Deploy
        run: |
          set -a && . ./.env.deploy && set +a
          cd infra && cdk deploy --all --require-approval never \
            -c environment=${{ inputs.environment }} \
            -c postgresDsn="${{ secrets.POSTGRES_DSN }}"

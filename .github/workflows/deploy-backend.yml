name: Deploy Backend

on:
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      branch:
        description: 'Branch/ref to build & deploy (prod requires main)'
        required: false
        type: string
        default: main

  # Allows the deploy-all orchestrator to invoke this workflow.
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: string
      branch:
        description: 'Branch/ref to build & deploy'
        required: false
        type: string
        default: main

permissions:
  id-token: write
  contents: read

jobs:
  check:
    name: Lint & Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handloom-admin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: handloom-admin/go.sum

      - name: Generate mocks
        run: |
          go install go.uber.org/mock/mockgen@latest
          make generate-mocks

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: handloom-admin

      - name: Test
        run: make test

      - name: Build check
        run: make build-lambdas-active

  build:
    name: Build Lambdas
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Guard prod deploy from non-main branches
        if: inputs.environment == 'prod' && inputs.branch != 'main'
        run: |
          echo "::error::Prod deploy must target main. Chosen branch: ${{ inputs.branch }}"
          exit 1

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: handloom-admin/go.sum

      - name: Build active Lambdas
        working-directory: handloom-admin
        run: make build-lambdas-active

      # tar before upload: actions/upload-artifact does not preserve the Unix
      # executable bit, and provided.al2023 requires an executable `bootstrap`.
      - name: Package binaries
        working-directory: handloom-admin
        run: tar czf lambda-bin.tar.gz bin/lambda

      - uses: actions/upload-artifact@v4
        with:
          name: backend-lambdas-${{ inputs.environment }}
          path: handloom-admin/lambda-bin.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handloom-admin
    steps:
      - name: Guard prod deploy from non-main branches
        if: inputs.environment == 'prod' && inputs.branch != 'main'
        run: |
          echo "::error::Prod deploy must target main. Chosen branch: ${{ inputs.branch }}"
          exit 1

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/download-artifact@v4
        with:
          name: backend-lambdas-${{ inputs.environment }}
          path: handloom-admin

      - name: Unpack binaries
        run: |
          tar xzf lambda-bin.tar.gz
          # restore exec bit the artifact round-trip may have dropped
          chmod +x bin/lambda/*/bootstrap

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # CDK app is `go run ./cmd/` — Go is required to synth/deploy.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: handloom-admin/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Register binfmt_misc handlers system-wide so plain `docker build`
      # (used by CDK NodejsFunction) can run arm64 images on amd64 runners.
      # docker/setup-qemu-action only works for buildx; this works globally.
      - name: Register arm64 binfmt handlers
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Write .env file
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "${{ secrets.BACKEND_ENV_PROD }}" > .env.deploy
          else
            echo "${{ secrets.BACKEND_ENV_DEV }}" > .env.deploy
          fi
          # Fail fast: an unset/empty BACKEND_ENV_* secret would otherwise deploy
          # Lambdas with no POSTGRES_DSN and only surface as runtime failures.
          if [ ! -s .env.deploy ]; then
            echo "::error::.env.deploy is empty — BACKEND_ENV_${{ inputs.environment }} secret is unset or blank." >&2
            exit 1
          fi
          if ! grep -q '^POSTGRES_DSN=.\+' .env.deploy; then
            echo "::error::POSTGRES_DSN is missing or empty in BACKEND_ENV_${{ inputs.environment }}." >&2
            exit 1
          fi

      - name: CDK Deploy
        env:
          # Gateway credentials propagated to Lambda env via infra/stacks/api.go.
          # AUTH_KEY = secret (sensitive). TEMPLATE_ID = vars (non-sensitive identifier).
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
          MSG91_OTP_TEMPLATE_ID: ${{ vars.MSG91_OTP_TEMPLATE_ID }}
        run: |
          # Stash step-env MSG91 values before sourcing .env.deploy, then
          # restore so step env wins over any blanks in the env file.
          _msg91_key="$MSG91_AUTH_KEY"
          _msg91_tid="$MSG91_OTP_TEMPLATE_ID"
          set -a && . ./.env.deploy && set +a
          export MSG91_AUTH_KEY="$_msg91_key"
          export MSG91_OTP_TEMPLATE_ID="$_msg91_tid"
          cd infra && cdk deploy --all --require-approval never \
            -c environment=${{ inputs.environment }}

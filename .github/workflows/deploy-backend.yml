name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, prod]
        default: dev

  # Allows the deploy-all orchestrator to invoke this workflow.
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  # Single job: build + deploy on one runner. Lambda binaries stay on-disk
  # instead of crossing a job boundary via an Actions artifact (was burning
  # storage quota). On-disk output keeps its exec bit, so the tar/untar/chmod
  # dance that worked around upload-artifact dropping it is gone too.
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handloom-admin
    steps:
      - name: Guard prod deploy from non-main branches
        if: inputs.environment == 'prod' && github.ref_name != 'main'
        run: |
          echo "::error::Prod deploy must target main. Selected ref: ${{ github.ref_name }}"
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: handloom-admin/go.sum

      - name: Build active Lambdas
        run: make build-lambdas-active

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Go already set up above for the Lambda build; CDK (`go run ./cmd/`) reuses it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Register binfmt_misc handlers system-wide so plain `docker build`
      # (used by CDK NodejsFunction) can run arm64 images on amd64 runners.
      # docker/setup-qemu-action only works for buildx; this works globally.
      - name: Register arm64 binfmt handlers
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Write .env file
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "${{ secrets.BACKEND_ENV_PROD }}" > .env.deploy
          else
            echo "${{ secrets.BACKEND_ENV_DEV }}" > .env.deploy
          fi
          # Fail fast: an unset/empty BACKEND_ENV_* secret would otherwise deploy
          # Lambdas with no POSTGRES_DSN and only surface as runtime failures.
          if [ ! -s .env.deploy ]; then
            echo "::error::.env.deploy is empty — BACKEND_ENV_${{ inputs.environment }} secret is unset or blank." >&2
            exit 1
          fi

      - name: Validate required secrets
        env:
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
        run: |
          # Fail the deploy now if a required secret is missing, instead of
          # shipping a Lambda that silently falls back to a gateway DevClient
          # (fake payments/OTP) and only breaks at runtime.

          # Required in every environment.
          required="POSTGRES_DSN"

          # Required in prod: PhonePe + OTP must be real, never DevClient.
          if [ "${{ inputs.environment }}" = "prod" ]; then
            required="$required PHONEPE_CLIENT_ID PHONEPE_CLIENT_SECRET PHONEPE_WEBHOOK_USERNAME PHONEPE_WEBHOOK_PASSWORD"
          fi

          missing=""
          for key in $required; do
            # Match `KEY=<non-empty>` (ignoring surrounding quotes/space) in the blob.
            if ! grep -qE "^${key}=['\"]?[^'\"[:space:]]" .env.deploy; then
              missing="$missing $key"
            fi
          done

          # MSG91_AUTH_KEY arrives as a step secret, not via the blob.
          if [ "${{ inputs.environment }}" = "prod" ] && [ -z "$MSG91_AUTH_KEY" ]; then
            missing="$missing MSG91_AUTH_KEY"
          fi

          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s) for ${{ inputs.environment }}:$missing. Set them in BACKEND_ENV_${{ inputs.environment }} (or the MSG91_AUTH_KEY secret) before deploying." >&2
            exit 1
          fi
          echo "All required secrets present for ${{ inputs.environment }}."

      - name: CDK Deploy
        env:
          # Only true SECRETS come from the workflow now. Non-secret gateway
          # config (URLs, versions, template id, pincode) is baked per-env in
          # infra/cmd/config.go. MSG91_AUTH_KEY is the one gateway secret kept
          # as its own GH secret; the rest live in the BACKEND_ENV_* blob.
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
        run: |
          # Stash the step-env secret before sourcing .env.deploy, then restore
          # so it wins over any blank in the env file.
          _msg91_key="$MSG91_AUTH_KEY"
          set -a && . ./.env.deploy && set +a
          export MSG91_AUTH_KEY="$_msg91_key"
          # Deploy every stack EXCEPT the embedder, which has its own workflow
          # (deploy-embedder.yml) because its container image needs a heavy
          # model-asset bootstrap. --exclusively stops CDK from pulling the
          # embedder in as APIStack's dependency: the API stack imports the
          # embedder's function ARN, which stays stable across embedder code
          # changes, so the import resolves against the already-deployed stack.
          cd infra && cdk deploy --exclusively \
            HandloomLogsStack-${{ inputs.environment }} \
            HandloomDatabaseStack-${{ inputs.environment }} \
            HandloomStorageStack-${{ inputs.environment }} \
            HandloomMetricsStack-${{ inputs.environment }} \
            HandloomAPIStack-${{ inputs.environment }} \
            --require-approval never \
            -c environment=${{ inputs.environment }}

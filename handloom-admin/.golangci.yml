# golangci-lint v2 configuration
# Run: golangci-lint run
# Docs: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
  sort-results: true
  sort-order:
    - file

linters:
  default: none
  enable:
    # Default linters (gosimple merged into staticcheck in v2)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - bodyclose
    - dupl
    - durationcheck
    - errname
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - nilerr
    - noctx
    - prealloc
    - predeclared
    - unconvert
    - wastedassign
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Writer).Write
        - (*encoding/json.Encoder).Encode

    govet:
      enable-all: true
      disable:
        - fieldalignment

    gocyclo:
      min-complexity: 25

    gocognit:
      min-complexity: 30

    goconst:
      min-len: 3
      min-occurrences: 3

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - commentedOutCode
        - exitAfterDefer
        - appendAssign
        - ifElseChain
        - assignOp
        - appendCombine

    gosec:
      excludes:
        - G104
        - G304
        - G101

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    unparam:
      check-exported: false

    dupl:
      threshold: 200

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gocyclo
          - gocognit
          - errcheck
          - gosec
          - goconst

      # TODO: order_service_test.go needs significant refactoring to match current domain models
      - path: order_service_test\.go
        linters:
          - all

      - path: generated
        linters:
          - all

      - path: _mock\.go
        linters:
          - all

      - path: mocks/
        linters:
          - all

      - path: cmd/
        linters:
          - forbidigo

      - path: testutil/
        linters:
          - errcheck
          - gosec

      - path: internal/handler/
        linters:
          - dupl

      - path: internal/repository/
        linters:
          - dupl

    max-issues-per-linter: 50
    max-same-issues: 5

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/handloom/admin

services:
  # LocalStack — unified AWS emulator (DynamoDB, S3, Lambda, API Gateway, IAM)
  localstack:
    image: localstack/localstack:latest
    container_name: handloom-localstack
    ports:
      - "4566:4566"           # LocalStack gateway
    environment:
      SERVICES: dynamodb,s3,lambda,apigateway,iam,sns,sqs
      DEBUG: 0
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -qE '\"dynamodb\": \"(available|running)\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # DynamoDB Admin UI (optional — browse tables in browser)
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: handloom-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      localstack:
        condition: service_healthy

  # PostgreSQL — catalog data (categories, products, inventory)
  postgres:
    image: postgres:16
    container_name: handloom-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: handloom
      POSTGRES_USER: handloom
      POSTGRES_PASSWORD: handloom
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handloom"]
      interval: 5s
      timeout: 3s
      retries: 5

  # pgAdmin — PostgreSQL admin UI (browse tables in browser)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: handloom-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@homechrome.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  localstack-data:
  postgres_data:
  pgadmin_data:
